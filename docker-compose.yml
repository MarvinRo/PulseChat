version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: Pulse_DB
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_aqui
      MYSQL_DATABASE: pulse_app
      MYSQL_USER: pulse_user
      MYSQL_PASSWORD: pulse_password_aqui
    ports:
      - "3306:3306"
    volumes:
      - pulse_db_data:/var/lib/mysql
      # Este volume executa o script SQL automaticamente na primeira inicialização:
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - pulse-network

  backend:
    build: ./Backend
    container_name: pulse_backend
    ports:
      - "3001:3001"
    env_file:
      - ./Backend/.env
    restart: always
    depends_on:
      - database
    networks:
      - pulse-network

  frontend:
    build: ./Frontend
    container_name: pulse_frontend
    ports:
      - "5173:5173"
    restart: always
    depends_on:
      - backend
    networks:
      - pulse-network

volumes:
  pulse_db_data:

networks:
  pulse-network:
    driver: bridge